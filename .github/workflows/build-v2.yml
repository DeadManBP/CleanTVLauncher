name: CleanTV 2.0 Build

on:
  push:
    branches: [cleantv-2.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check permanent signing configuration
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.CLEANTV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CLEANTV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLEANTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLEANTV_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Permanent signing secrets are missing. Refusing to publish an unsigned test APK."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Prepare and validate permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.CLEANTV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CLEANTV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLEANTV_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cleantv-release.jks"
          test -s "$RUNNER_TEMP/cleantv-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/cleantv-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "CLEANTV_KEYSTORE_FILE=$RUNNER_TEMP/cleantv-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests and Android lint
        run: gradle :app2:testDebugUnitTest :app2:lintDebug --no-daemon

      - name: Build CleanTV 2.0 signed test APK
        env:
          CLEANTV_KEYSTORE_PASSWORD: ${{ secrets.CLEANTV_KEYSTORE_PASSWORD }}
          CLEANTV_KEY_ALIAS: ${{ secrets.CLEANTV_KEY_ALIAS }}
          CLEANTV_KEY_PASSWORD: ${{ secrets.CLEANTV_KEY_PASSWORD }}
        run: gradle :app2:assembleDebug --no-daemon

      - name: Verify APK signing certificate
        env:
          STORE_PASSWORD: ${{ secrets.CLEANTV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLEANTV_KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED=$(keytool -exportcert -keystore "$RUNNER_TEMP/cleantv-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')
          ACTUAL=$( "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app2/build/outputs/apk/debug/app2-debug.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {gsub(":","",$2); print toupper($2)}')
          echo "Expected certificate SHA-256: $EXPECTED"
          echo "APK certificate SHA-256:      $ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-2.0-dev-signed
          path: app2/build/outputs/apk/debug/app2-debug.apk
          if-no-files-found: error
          retention-days: 30
